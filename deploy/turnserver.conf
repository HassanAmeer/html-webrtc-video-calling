# =============================================================================
# coturn configuration for this app  ->  install at /etc/turnserver.conf
# =============================================================================
#
# CRITICAL: relay-ip MUST be set explicitly.
#
# If only "listening-ip=0.0.0.0" + "external-ip=<public>" are configured,
# coturn registers a public->private mapping of the public IP onto 0.0.0.0.
# Every peer address equal to the server's own public IP is then mapped to the
# zero address and rejected by good_peer_addr() BEFORE the allowed-peer-ip
# whitelist is consulted. Both callers end up with a relay on the same server,
# so every relay-to-relay CREATE_PERMISSION / CHANNEL_BIND fails with
# "403 Forbidden IP" and ICE never produces a candidate pair. The call looks
# "attended" but has no audio and no video.
#
# Pinning relay-ip makes that mapping an identity and relay-to-relay works.
# =============================================================================

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Public IP advertised in relay candidates.
relay-ip=201.18.218.29
external-ip=201.18.218.29

realm=v.tokendeal.cloud
fingerprint
lt-cred-mech
user=webrtc:webrtcpass123

min-port=49160
max-port=50000

no-stdout-log
no-cli
