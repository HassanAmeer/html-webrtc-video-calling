# =============================================================================
# Secondary coturn listener: UDP/443 only  ->  /etc/turnserver-443.conf
# Unit file: deploy/coturn-443.service
# =============================================================================
#
# Fallback for ISPs that block UDP/TCP 3478. TCP/443 belongs to nginx, so this
# instance must never bind TCP (no-tcp / no-tls / no-dtls).
#
# The systemd unit must grant CAP_NET_BIND_SERVICE (port 443 is privileged),
# see deploy/coturn-443.service.
#
# It uses its own relay range and its own sqlite file so it never competes with
# the primary instance.
# =============================================================================

listening-port=443
no-tcp
no-tls
no-dtls
listening-ip=0.0.0.0

relay-ip=201.18.218.29
external-ip=201.18.218.29

realm=v.tokendeal.cloud
fingerprint
lt-cred-mech
user=webrtc:webrtcpass123

min-port=50200
max-port=51000
userdb=/var/lib/turn/turndb443

no-stdout-log
no-cli
