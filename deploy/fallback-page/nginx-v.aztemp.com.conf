server {
    server_name v.aztemp.com;

    client_max_body_size 10M;

    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # Enterprise-grade Security Headers
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy       "camera=*, microphone=*, display-capture=*" always;

    # Deploy windows: show a friendly auto-refreshing page instead of a raw 502
    error_page 502 503 504 /__updating__;

    location = /__updating__ {
        root /var/www/vwebrtc-updating;
        internal;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /updating.html =502;
    }


    # Self-hosted icon fonts (Font Awesome 6.0.0): version-locked filenames,
    # safe to cache permanently.
    location ^~ /vendor/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Static assets: long-lived caching for versioned (?v=) requests only
    location ~* ^/(js|css|images|downloads)/.+\.(js|css|png|jpg|jpeg|svg|ico|apk|woff2?)$ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $static_cache always;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/v.aztemp.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/v.aztemp.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = v.aztemp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name v.aztemp.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}