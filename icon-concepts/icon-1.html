<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 1024px; background: #05070a; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#182029"/>
      <stop offset="0.55" stop-color="#0b1017"/>
      <stop offset="1" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7ff3e0"/>
      <stop offset="0.45" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1f6bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#2563eb" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="500" cy="470" rx="430" ry="390" fill="url(#glow)"/>

  <!-- monitor -->
  <rect x="158" y="250" width="470" height="322" rx="58" fill="none"
        stroke="url(#mark)" stroke-width="38"/>
  <!-- stand -->
  <rect x="366" y="570" width="54" height="62" rx="23" fill="url(#mark)"/>
  <rect x="296" y="630" width="194" height="40" rx="20" fill="url(#mark)"/>
  <!-- live camera indicator -->
  <circle cx="566" cy="298" r="44" fill="url(#dotGlow)"/>
  <circle cx="566" cy="298" r="21" fill="#7ff3e0"/>

  <!-- phone (separated from monitor with a background-coloured cutout) -->
  <rect x="652" y="556" width="204" height="300" rx="62" fill="#0b1017"/>
  <rect x="666" y="570" width="176" height="272" rx="50" fill="#060a10"
        stroke="url(#mark)" stroke-width="32"/>
  <rect x="726" y="596" width="56" height="9" rx="4.5" fill="#67e8f9" opacity="0.9"/>
  <rect x="724" y="800" width="60" height="9" rx="4.5" fill="#38bdf8" opacity="0.5"/>
</svg>
</body>
</html>
