plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tokendeal.vremote'
    compileSdk 34

    // versionName is the single source of truth. versionCode is DERIVED from it
    // (major*10000 + minor*100 + patch) so it can never be forgotten — a stale
    // versionCode makes Android reject the update with "App not installed".
    def vName = "6.4.31"
    def vParts = vName.tokenize('.')
    def vCode = (vParts[0] as int) * 10000 + (vParts[1] as int) * 100 + (vParts[2] as int)

    defaultConfig {
        applicationId "com.tokendeal.vremote"
        minSdk 21
        targetSdk 34
        versionCode vCode
        versionName vName

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "tokendeal123"
            keyAlias "vremote"
            keyPassword "tokendeal123"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Android Jetpack WorkManager for 30-minute Background Keep-Alive & Reconnection
    implementation 'androidx.work:work-runtime:2.9.0'

    // Official WebRTC Android SDK (MavenCentral release)
    implementation 'io.github.webrtc-sdk:android:125.6422.06'

    // Socket.io for Real-time WebRTC Signaling to v.tokendeal.cloud
    implementation('io.socket:socket.io-client:2.1.1') {
        exclude group: 'org.json', module: 'json'
    }

    // JSON support
    implementation 'com.google.code.gson:gson:2.10.1'
}
