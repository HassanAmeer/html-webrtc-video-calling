<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found</title>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #15181c;
        color: #e5e7eb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        padding: 24px;
    }
    .card {
        width: 100%;
        max-width: 380px;
        background: #1c2026;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 32px 26px;
        text-align: center;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }
    .code {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #9ca3af;
        margin-bottom: 10px;
    }
    h1 { font-size: 17px; font-weight: 600; margin: 0 0 10px; color: #f3f4f6; }
    p { font-size: 13px; line-height: 1.55; color: #8b919b; margin: 0 0 22px; }
    a {
        display: inline-block;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        color: #f9fafb;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 10px 20px;
        border-radius: 10px;
        transition: background 0.18s ease;
    }
    a:hover { background: rgba(255, 255, 255, 0.14); }
</style>
</head>
<body>
    <div class="card">
        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you are looking for does not exist or has been moved. Check the link and try again.</p>
        <a href="/">Go Back</a>
    </div>
</body>
</html>
